spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: Zadanieslave

  datasource:
    # Для начала используем H2 (встроенная)
    url: jdbc:h2:mem:execdocdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password:
    # Для PostgreSQL (закомментировано):
    # url: jdbc:postgresql://localhost:5432/execdoc
    # username: postgres
    # password: secret
    # driverClassName: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
        # Для PostgreSQL: org.hibernate.dialect.PostgreSQLDialect

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.transaction: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.example.zadanieslave: DEBUG
app:
  xml:
    xsd-path: classpath:xsd/schema.xsd
  upload:
    dir: ./uploads